train:
  augs: # Why no geometric augmentations? e.g., flipping.
    - class_name: albumentations.RandomBrightnessContrast
      params:
        brightness_limit: [-0.6,0.8] #0.8
        contrast_limit: [-0.1,0.8] #0.8
        brightness_by_max: true # added
        p: 0.7

    - class_name: albumentations.GaussianBlur
      params:
        blur_limit: [3,7]
        sigma_limit: 0
        p: 0.3
    
    - class_name: albumentations.MedianBlur
      params:
        blur_limit: 7
        p: 0.3

    - class_name: albumentations.Defocus
      params:
        radius: [3,10]
        alias_blur: [0.1,0.5]
        p: 0.3
    
    - class_name: albumentations.GaussNoise
      params:
        var_limit: [10.0, 50.0]
        p: 0.3
    
    - class_name: albumentations.ISONoise
      params:
        color_shift: [0.01,0.05]
        intensity: [0.1,0.5]
        p: 0.3

    - class_name: albumentations.MultiplicativeNoise
      params:
        multiplier: [0.9,1.1]
        per_channel: False
        elementwise: False
        p: 0.3

    - class_name: albumentations.Posterize
      params:
        num_bits: 4
        p: 0.5

    - class_name: albumentations.Sharpen
      params:
        alpha: [0.2, 0.5]
        lightness: [0.5, 1.0]
        p: 0.6

    - class_name: albumentations.Solarize
      params:
        threshold: 64
        # threshold_range: [0.3,0.3] #added
        p: 0.5

    - class_name: albumentations.Spatter
      params:
        mean: [0.65,0.65]
        std: [0.3,0.3]
        gauss_sigma: [2,2]
        cutout_threshold: [0.68,0.68]
        intensity: [0.6,0.6]
        mode: rain
        color: null
        p: 0.3

    - class_name: albumentations.Equalize
      params:
        mode: cv
        p: 0.6

    - class_name: albumentations.RandomGamma
      params:
        gamma_limit: [80,120]
        p: 0.4

    - class_name: albumentations.RandomSunFlare
      params:
        flare_roi: [0.0, 0.0, 1.0, 0.5]
        method: overlay
        num_flare_circles_range: [6,10]
        angle_range: [0,1]
        p: 0.7

    - class_name: albumentations.Normalize
      params:
        p: 1.0
    - class_name: albumentations.pytorch.transforms.ToTensorV2
      params:
        p: 1.0
test:
  augs:
    - class_name: albumentations.Normalize
      params:
        p: 1.0
    - class_name: albumentations.pytorch.transforms.ToTensorV2
      params:
        p: 1.0
