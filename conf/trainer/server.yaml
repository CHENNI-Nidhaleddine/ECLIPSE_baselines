accumulate_grad_batches: 1
profiler: False
max_epochs: 50
log_every_n_steps: 10
num_sanity_val_steps: 0
accelerator: gpu
strategy:  ddp_find_unused_parameters_true
sync_batchnorm: True
devices: 1 # number of GPUs (int) or list of GPU ids, e.g. [0,1]
precision: 32-true # options: 32-true, 16-mixed, bf16-mixed. Don't use 16-mixed
check_val_every_n_epoch: 1
