seed: 2024
id: baseline
project_name: SPEEDplus
wandb_offline: True
mode: train # [train, val, test]; test.py switches this to `test` automatically
debug: False # if True, only the first 100 samples of each split are used
log_code: True # copy src/ and train.py into the run directory
save_pytorch_model: True
save_best: True
# Root folder that contains the dataset folder `${general.dataset_id}`.
# Override on the command line, e.g. `general.dataset_dir=/data`.
dataset_dir: ./data
dataset_id: speedplus
dataset_root: ${general.dataset_dir}/${general.dataset_id}
output_dir: ./outputs/${general.id}/${now:%Y-%m-%d_%H-%M-%S}
# Path to a Lightning checkpoint (.ckpt). Must be null for training, required for test.py / infer_folder.py.
checkpoint_path: null
